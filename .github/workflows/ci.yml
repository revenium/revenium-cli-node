name: CI

on:
  push:
    branches: [main, deploy]
  # Every PR, whatever it targets. Scoping this to main meant a stacked PR — a normal pattern in
  # this repo — ran no build-and-test at all, while still showing a green tick from the checks
  # that did run. secret-scan.yml already uses this pattern.
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run build
      - run: npm run verify:public

      - run: npm test
